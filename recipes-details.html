<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recipe Generator | Case Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --paper:#060713; --ink:#f5f6ff; --burgundy:#56a3ff; --rule:rgba(124, 102, 255, 0.35); --muted:rgba(245,246,255,0.68); }
        body { margin:0; font-family:"Newsreader",serif; background:var(--paper); color:var(--ink); }
        .wrap { width:min(980px,92%); margin:0 auto; padding:2rem 0 3rem; }
        h1 { color:var(--burgundy); margin-bottom:.4rem; }
        .meta { font-family:"Work Sans",sans-serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
        .rule { border-top:3px double var(--rule); margin:1rem 0 1.4rem; }
        .grid { display:grid; gap:1rem; grid-template-columns:repeat(2,1fr); }
        img { width:100%; border:1px solid var(--rule); background:rgba(255,255,255,0.03); display:block; }
        .back { display:inline-block; margin-top:1.2rem; font-family:"Work Sans",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:.72rem; color:var(--burgundy); text-decoration:none; border-bottom:1px solid transparent; }
        .back:hover { border-bottom-color: var(--burgundy); }
        @media (max-width:700px){ .grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <main class="wrap">
        <p class="meta">Case Study</p>
        <h1>AI Recipe Generator</h1>
        <p>An AI-powered mobile experience that suggests recipes based on your ingredients and preferences, with a clean, step-by-step cooking flow.</p>
        <div class="rule"></div>
        <div class="grid">
            <img src="recipes_app_mokup.png" alt="AI Recipe Generator screenshot">
            <img src="recipes_app_mokup.png" alt="AI Recipe Generator screenshot">
        </div>
        <a class="back" href="index.html#projects">Back to projects</a>
    </main>
</body>
</html>
