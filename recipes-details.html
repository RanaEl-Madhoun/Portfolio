<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes App | Case Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --paper:#e8d9c5; --ink:#22191a; --burgundy:#6d1f2f; --rule:#877274; }
        body { margin:0; font-family:"Newsreader",serif; background:var(--paper); color:var(--ink); }
        .wrap { width:min(980px,92%); margin:0 auto; padding:2rem 0 3rem; }
        h1 { color:var(--burgundy); margin-bottom:.4rem; }
        .meta { font-family:"Work Sans",sans-serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color:#544244; }
        .rule { border-top:3px double var(--rule); margin:1rem 0 1.4rem; }
        .grid { display:grid; gap:1rem; grid-template-columns:repeat(2,1fr); }
        img { width:100%; border:1px solid var(--rule); background:#fff; display:block; }
        .back { display:inline-block; margin-top:1.2rem; font-family:"Work Sans",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:.72rem; color:var(--burgundy); }
        @media (max-width:700px){ .grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <main class="wrap">
        <p class="meta">Case Study</p>
        <h1>Recipes App</h1>
        <p>A mobile experience for discovering and organizing recipes with clear categories and step-by-step reading flow.</p>
        <div class="rule"></div>
        <div class="grid">
            <img src="recipes_app_mokup.png" alt="Recipes app screenshot">
            <img src="recipes_app_mokup.png" alt="Recipes app screenshot">
        </div>
        <a class="back" href="index.html#projects">Back to projects</a>
    </main>
</body>
</html>
